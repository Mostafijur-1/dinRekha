name: গুণমান যাচাই

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ফরম্যাট, লিন্ট, টাইপ, টেস্ট ও বিল্ড
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      AUTH_SECRET: github-actions-only-auth-secret-at-least-32-characters
      MONGODB_URI: mongodb://127.0.0.1:27017
      MONGODB_DB_NAME: chondo_ci
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            npm ci \
              --fetch-retries=5 \
              --fetch-retry-mintimeout=10000 \
              --fetch-retry-maxtimeout=60000 2>&1 | tee "npm-ci-attempt-${attempt}.log"
            install_status=${PIPESTATUS[0]}
            if [ "$install_status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              {
                echo "### Dependency installation failure"
                echo '```text'
                tail -n 80 "npm-ci-attempt-${attempt}.log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              error_message=$(tail -n 30 "npm-ci-attempt-${attempt}.log" | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
              echo "::error title=Dependency installation failure::$error_message"
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Run tests
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose 2>&1 | tee test-output.log
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            {
              echo "### Test failure"
              echo '```text'
              tail -n 120 test-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            error_message=$(tail -n 30 test-output.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Test failure::$error_message"
          fi
          exit "$test_status"
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
